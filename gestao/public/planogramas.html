<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planogramas | GôndolaFoco</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/planogramas.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="/favicon.svg" alt=""><div><strong>GôndolaFoco</strong><small>GESTÃO</small></div></div><div class="side-caption">PAINEL GERENCIAL</div><nav><a class="nav" href="/">◫ Visão geral</a><a class="nav" href="/#occurrences">⚑ Ocorrências</a><a class="nav" href="/#audits">▤ Auditorias</a><a class="nav active" aria-current="page" href="/planogramas.html">▦ Planogramas</a></nav></aside><main class="main"><header class="topbar"><div class="breadcrumb">GôndolaFoco <span>/</span> <b>Planogramas</b></div></header><div class="content pg"><div class="heading"><div><div class="eyebrow">INTELIGÊNCIA DE GÔNDOLA</div><h1>Planogramas</h1><p>Cadastre e consulte os padrões de exposição por setor.</p></div></div><form id="cadastro" class="panel"><h2>Novo planograma</h2><p class="panel-sub">Informe a localização e os arquivos de referência.</p><div class="pg-grid"><label>Loja<input name="loja" required maxlength="100" placeholder="Ex.: Loja 01"></label><label>Setor<input name="setor" required maxlength="100" placeholder="Ex.: Laticínios"></label><label>Gôndola<input name="gondola" required maxlength="100" placeholder="Ex.: Refrigerador 01"></label><label>Fotografia de referência<input name="foto" type="file" accept="image/*" required></label><label>CSV do planograma<input name="plan" type="file" accept=".csv" required></label><label>CSV de preços e estoque<input name="precos" type="file" accept=".csv" required></label></div><div class="pg-actions"><button class="pg-primary">Processar referência</button><p id="status" role="status"></p></div></form><h2 class="pg-section">Referências cadastradas</h2><section id="lista"></section></div></main></div><script src="/planogramas.js" defer></script></body></html>
